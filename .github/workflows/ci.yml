name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-secret-key
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen
      - name: Lint
        run: uv run ruff check apps config tests
      - name: Django checks
        run: uv run python manage.py check --settings=config.settings.test
      - name: Local settings check
        run: uv run python manage.py check --settings=config.settings.local
      - name: Migration consistency
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Tests
        run: uv run pytest
      - name: Compose renders
        run: docker compose config --quiet
